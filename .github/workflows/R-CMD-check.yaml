name: R CMD check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same runner and R version as the vignette workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # The package vignettes download small Bioconductor datasets. The website
      # articles in vignettes/articles are not in the package; the Pages
      # workflow builds them.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          error-on: '"warning"'
